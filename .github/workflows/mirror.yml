# Mirrors this repository to the GitHub account that Vercel deploys from.
#
# Why this exists: the code lives in rmhwebsites/ugasmif, but the Vercel
# project is connected to a different GitHub account. This pushes every commit
# on main to that account's copy so deploys stay current.
#
# It runs on push rather than on a schedule, so a deploy starts within seconds
# instead of waiting for the next poll.
#
# ── Setup (once) ────────────────────────────────────────────────────────────
#
# 1. On the ACCOUNT THAT OWNS THE MIRROR, create a token:
#      github.com/settings/personal-access-tokens/new
#      - Repository access: only the mirror repository
#      - Permissions: Contents -> Read and write
#      - Expiry: set a reminder, because the sync stops silently when it lapses
#
# 2. In THIS repository: Settings -> Secrets and variables -> Actions ->
#    New repository secret
#      Name:  MIRROR_TOKEN
#      Value: the token from step 1
#
# 3. Optional, if the mirror is not <owner>/ugasmif: add a repository
#    variable MIRROR_REPO with the value "owner/name".
#
# ── What it does to the mirror ──────────────────────────────────────────────
#
# Force-pushes main. The mirror is a copy, not a place to work: anything
# committed there directly is overwritten on the next push here. Branches
# other than main are left alone.
#
# Force is deliberate. If the mirror was created by importing or forking, its
# history is unrelated to this one and an ordinary push is rejected outright.
#
# One thing to check on the mirror after the first sync: its DEFAULT BRANCH
# must be main, or Vercel will keep deploying whatever branch it thinks is
# default and appear to ignore the sync.

name: Mirror to deploy account

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

# Two pushes in quick succession would otherwise race to force-push.
concurrency:
  group: mirror-main
  cancel-in-progress: false

jobs:
  mirror:
    # This file is mirrored along with everything else, so without this guard
    # it would run in the MIRROR too, find no MIRROR_TOKEN (secrets are not
    # copied) and fail on every sync. The guard makes it skip there instead.
    if: github.repository == 'rmhwebsites/ugasmif'
    runs-on: ubuntu-latest
    steps:
      - name: Check the token is configured
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions. The setup steps are in the comments at the top of .github/workflows/mirror.yml."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Full history: a shallow clone cannot be pushed to another remote.
          fetch-depth: 0

      - name: Push main to the mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.MIRROR_REPO || 'ryboss36010/ugasmif' }}
        run: |
          set -euo pipefail
          echo "Mirroring $GITHUB_SHA to $MIRROR_REPO"
          # The token goes in the URL, so keep it out of the log: git prints
          # the remote name on failure, never the URL.
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"
          git push --force mirror "HEAD:refs/heads/main"
          git push --force --tags mirror
          echo "Mirrored to https://github.com/${MIRROR_REPO}"
